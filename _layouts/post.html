---
layout: default
---
<article>
  <div class="post-header">
    <div class="wrap-narrow">
      <span class="post-card-date">{{ page.date | date: "%B %-d, %Y" }}</span>
      <h1>{{ page.title }}</h1>
    </div>
  </div>
  <div class="post-body">
    <div class="wrap-narrow">
      {{ content }}
      <a class="back-link" href="{{ '/blog/' | relative_url }}">&larr; Back to all posts</a>
    </div>
  </div>
</article>
