title: BreathCheck
description: "A breathing companion for your workday. Short check-ins and guided exercises for developers, IT professionals, and anyone who spends the day at a screen."
url: "https://breathcheck.site"
baseurl: ""
logo: /assets/images/og-image.png

author:
  name: "BreathCheck"

markdown: kramdown
permalink: /blog/:title/

collections:
  posts:
    output: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
